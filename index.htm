<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماهان | نمونه کار</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  
  .container { max-width: 800px; width: 100%; text-align: center; }
  
  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #fff, #ffd89b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .subtitle { font-size: 1.1rem; opacity: 0.9; margin-bottom: 40px; }
  
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  
  .card h2 { margin-bottom: 20px; font-size: 1.5rem; }
  
  .game-board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
  }
  
  .cell {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 15px;
    font-size: 3rem;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .cell:hover:not(.taken) {
    background: rgba(255,255,255,0.25);
    transform: scale(1.05);
  }
  
  .cell.taken { cursor: not-allowed; }
  .cell.x { color: #ffd89b; }
  .cell.o { color: #a8edea; }
  
  .status {
    font-size: 1.2rem;
    margin: 20px 0;
    min-height: 30px;
    font-weight: bold;
  }
  
  .btn {
    background: linear-gradient(90deg, #ffd89b, #ffb347);
    color: #333;
    border: none;
    padding: 12px 30px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s;
    margin-top: 10px;
  }
  
  .btn:hover { transform: scale(1.05); }
  
  .footer { opacity: 0.7; font-size: 0.9rem; margin-top: 20px; }
</style>
</head>
<body>
  <div class="container">
    <h1>ماهان</h1>
    <p class="subtitle">به نمونه کار من خوش آمدید ✨</p>
    
    <div class="card">
      <h2>🎮 بازی دوز با بات</h2>
      <div class="game-board" id="board">
        <div class="cell" data-i="0"></div>
        <div class="cell" data-i="1"></div>
        <div class="cell" data-i="2"></div>
        <div class="cell" data-i="3"></div>
        <div class="cell" data-i="4"></div>
        <div class="cell" data-i="5"></div>
        <div class="cell" data-i="6"></div>
        <div class="cell" data-i="7"></div>
        <div class="cell" data-i="8"></div>
      </div>
      <div class="status" id="status">نوبت توئه (X) 🎯</div>
      <button class="btn" onclick="resetGame()">بازی جدید</button>
    </div>
    
    <p class="footer">ساخته شده با HTML, CSS, JavaScript</p>
  </div>

<script>
  const board = document.getElementById('board');
  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');
  
  let state = ['', '', '', '', '', '', '', '', ''];
  let playerTurn = true;
  let gameOver = false;
  
  const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  
  function checkWinner(s, p) {
    return winPatterns.some(pattern => pattern.every(i => s[i] === p));
  }
  
  function isDraw(s) {
    return s.every(cell => cell !== '');
  }
  
  function minimax(s, depth, isMax) {
    if (checkWinner(s, 'O')) return 10 - depth;
    if (checkWinner(s, 'X')) return depth - 10;
    if (isDraw(s)) return 0;
    
    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (s[i] === '') {
          s[i] = 'O';
          best = Math.max(best, minimax(s, depth + 1, false));
          s[i] = '';
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (s[i] === '') {
          s[i] = 'X';
          best = Math.min(best, minimax(s, depth + 1, true));
          s[i] = '';
        }
      }
      return best;
    }
  }
  
  function bestMove() {
    let bestScore = -Infinity;
    let move = -1;
    for (let i = 0; i < 9; i++) {
      if (state[i] === '') {
        state[i] = 'O';
        let score = minimax(state, 0, false);
        state[i] = '';
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }
  
  function render() {
    cells.forEach((cell, i) => {
      cell.textContent = state[i];
      cell.className = 'cell';
      if (state[i]) {
        cell.classList.add('taken', state[i].toLowerCase());
      }
    });
  }
  
  function endGame(msg) {
    gameOver = true;
    status.textContent = msg;
  }
  
  function checkState() {
    if (checkWinner(state, 'X')) {
      endGame('🎉 بردی! آفرین');
      return true;
    }
    if (checkWinner(state, 'O')) {
      endGame('😢 بات برد! دوباره امتحان کن');
      return true;
    }
    if (isDraw(state)) {
      endGame('🤝 مساوی شد!');
      return true;
    }
    return false;
  }
  
  function botMove() {
    if (gameOver) return;
    const move = bestMove();
    if (move === -1) return;
    state[move] = 'O';
    render();
    if (!checkState()) {
      playerTurn = true;
      status.textContent = 'نوبت توئه (X) 🎯';
    }
  }
  
  cells.forEach((cell, i) => {
    cell.addEventListener('click', () => {
      if (!playerTurn || state[i] || gameOver) return;
      
      state[i] = 'X';
      playerTurn = false;
      render();
      
      if (checkState()) return;
      
      status.textContent = 'بات داره فکر می‌کنه... 🤔';
      setTimeout(botMove, 500);
    });
  });
  
  function resetGame() {
    state = ['', '', '', '', '', '', '', '', ''];
    playerTurn = true;
    gameOver = false;
    status.textContent = 'نوبت توئه (X) 🎯';
    render();
  }
  
  render();
</script>
</body>
  </html>
